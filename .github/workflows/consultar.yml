# Consulta manual: produção campo a campo de uma empresa, para conferir
# contra o relatório que ela divulga. Não mexe no site.
name: Consultar empresa

on:
  workflow_dispatch:
    inputs:
      grupo:
        description: "Empresa ou grupo (ex.: PRIO, Brava Energia, Petrorecôncavo)"
        default: "PRIO"
      meses:
        description: "Quantos meses mostrar"
        default: "3"

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recupera os arquivos já baixados da ANP
        uses: actions/cache/restore@v4
        with:
          path: dados/brutos
          key: brutos-consulta-${{ github.run_id }}
          restore-keys: brutos-

      - name: Consulta
        env:
          ANO_INICIAL: "2018"   # a empresa de cada campo vem dos arquivos por poço (até 2023)
        run: python -m robo.consultar "${{ inputs.grupo }}" --meses "${{ inputs.meses }}" | tee -a "$GITHUB_STEP_SUMMARY"
