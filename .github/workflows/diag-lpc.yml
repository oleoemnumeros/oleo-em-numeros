name: Diagnóstico temporário - guardar saída do leitor
on:
  push:
    branches: [diag-lpc]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar via leitor
        run: |
          mkdir -p diag4
          X="https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/arquivos-lpc/2026/resumo_semanal_lpc_2026_11_08-2026_11_14.xlsx"
          P="https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/levantamento-de-precos-de-combustiveis-ultimas-semanas-pesquisadas"
          curl -s -o diag4/semana.txt --max-time 120 "https://r.jina.ai/$X"
          curl -s -o diag4/pagina.txt --max-time 120 "https://r.jina.ai/$P"
          ls -la diag4
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git add diag4 && git commit -m "diag4" && git push
