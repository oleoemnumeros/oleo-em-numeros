name: Diagnóstico temporário - planilha semanal 2026 (ANP)
on:
  push:
    branches: [diag-lpc]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf diag diag2; mkdir -p diag3 && cd diag3
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36"
          B="https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/arquivos-lpc/2026"
          curl -sSL -A "$UA" "$B/resumo_semanal_lpc_2026_11_08-2026_11_14.xlsx" -o s46.xlsx
          curl -sSL -A "$UA" "$B/resumo_semanal_lpc_2026_11_01-2026_11_07.xlsx" -o s45.xlsx
          curl -sSL -A "$UA" -w "mdic %{http_code}\n" "https://www.gov.br/mdic/pt-br" -o /dev/null || true
          ls -la
      - run: |
          git config user.name "diag"; git config user.email "diag@users.noreply.github.com"
          git add -A && git commit -m "diag: 2026" && git push
