name: Diagnóstico temporário - produção pelo leitor
on:
  push:
    branches: [diag-lpc]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler páginas e um arquivo de produção
        run: |
          mkdir -p diag5 && cd diag5
          for P in "https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/producao-de-petroleo-e-gas-natural-por-poco" "https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/serie-historica-de-precos-de-combustiveis" "https://www.gov.br/anp/pt-br/centrais-de-conteudo/dados-abertos/participacoes-governamentais"; do
            n=$(echo "$P" | sed 's#.*/##'); curl -s -o "$n.html" -w "$n html: %{http_code} %{size_download}B\n" --max-time 120 -H "X-Return-Format: html" "https://r.jina.ai/$P"
          done
          grep -oE 'href="[^"]+\.(zip|csv|xlsx?)"' producao-de-petroleo-e-gas-natural-por-poco.html | sed 's/href="//;s/"$//' | sort -u > links_producao.txt
          wc -l links_producao.txt; tail -5 links_producao.txt
          U=$(grep -E '\.csv$' links_producao.txt | grep -E '2026' | tail -1); echo "testando $U"
          [ -n "$U" ] && curl -s -o prod.txt -w "csv pelo leitor: %{http_code} %{size_download}B %{time_total}s\n" --max-time 300 -H "X-Return-Format: text" "https://r.jina.ai/$U"
          head -c 600 prod.txt 2>/dev/null; echo
          cd ..; git config user.name diag; git config user.email diag@users.noreply.github.com
          rm -f diag5/prod.txt; git add diag5 && git commit -m diag5 && git push
