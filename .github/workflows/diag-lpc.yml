name: Diagnóstico temporário - leitor jina para planilhas
on:
  push:
    branches: [diag-lpc]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Testes
        run: |
          X="https://www.gov.br/anp/pt-br/assuntos/precos-e-defesa-da-concorrencia/precos/arquivos-lpc/2026/resumo_semanal_lpc_2026_11_08-2026_11_14.xlsx"
          curl -s -o j.txt -w "jina planilha: %{http_code} %{size_download}B\n" --max-time 120 "https://r.jina.ai/$X" || echo "falhou $?"
          head -c 1500 j.txt; echo; grep -c "GASOLINA" j.txt || true
          curl -s -o k.bin -w "jina binário: %{http_code} %{size_download}B\n" --max-time 120 -H "X-Respond-With: raw" "https://r.jina.ai/$X" || echo "falhou $?"; head -c 4 k.bin | xxd | head -1
          curl -s -o /dev/null -w "direto agora: %{http_code}\n" --max-time 20 "$X" || echo "direto falhou $?"
