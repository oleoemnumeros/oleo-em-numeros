# Atualização do Óleo em Números.
# Dias 5, 15 e 25: baixa a ANP (que não tem data fixa), confere, gera e publica.
# Todo dia: coleta as manchetes do setor e republica, sem baixar a ANP de novo.
# Se a conferência encontrar algo crítico, o job falha, o GitHub manda e-mail
# e o site continua com a última versão boa.
name: Atualização do site

on:
  schedule:
    - cron: "17 11 5,15,25 * *"   # dias 5, 15 e 25, às 8h17 de Brasília: dados da ANP
    - cron: "23 10 * * *"         # todo dia, às 7h23 de Brasília: notícias
  workflow_dispatch:                # botão "Run workflow" para rodar na mão
    inputs:
      ano_inicial:
        description: "Primeiro ano da base (2018 = histórico completo)"
        default: "2018"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # para manter o agendamento ativo (o GitHub pausa após 60 dias sem commits)

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Modo da execução
        id: modo
        run: |
          if [ "${{ github.event.schedule }}" = "23 10 * * *" ]; then
            echo "baixar=nao" >> "$GITHUB_OUTPUT"; echo "Execução diária: só notícias."
          else
            echo "baixar=sim" >> "$GITHUB_OUTPUT"; echo "Execução completa: baixa a ANP."
          fi

      - name: Recupera os arquivos já baixados da ANP
        uses: actions/cache/restore@v4
        with:
          path: dados/brutos
          key: brutos-${{ github.run_id }}
          restore-keys: brutos-

      - name: Robô de dados (baixar, ler, agregar, conferir)
        env:
          ANO_INICIAL: ${{ inputs.ano_inicial || '2018' }}
        run: python -m robo.executar ${{ steps.modo.outputs.baixar == 'nao' && '--sem-baixar' || '' }}

      # guarda os downloads mesmo se a conferência falhar: a próxima execução não baixa tudo de novo
      # resultados trimestrais da CVM: se falhar, o site sai sem a seção, nunca deixa de publicar
      - name: Resultados das listadas (CVM)
        run: python -m robo.cvm || echo "::warning::Leitura da CVM falhou; o site sai sem os resultados trimestrais."

      # royalties e participação especial por estado e município: se falhar, o site sai sem a seção
      - name: Royalties (ANP)
        run: python -m robo.royalties || echo "::warning::Leitura dos royalties falhou; o site sai sem a seção de royalties."

      # limites dos campos e posição dos poços (mapa): se o download falhar, usa a última cópia;
      # sem cópia nenhuma, o site sai sem a aba Mapa, nunca deixa de publicar
      - name: Recupera os shapefiles do mapa
        uses: actions/cache/restore@v4
        with:
          path: dados/geo
          key: geo-${{ github.run_id }}
          restore-keys: geo-

      - name: Mapa (ANP)
        run: |
          if [ "${{ steps.modo.outputs.baixar }}" = "sim" ]; then
            python -m robo.mapa || { echo "::warning::Download do mapa falhou; usando a última cópia."; python -m robo.mapa --sem-baixar || echo "::warning::O site sai sem o mapa."; }
          else
            python -m robo.mapa --sem-baixar || python -m robo.mapa || echo "::warning::O site sai sem o mapa."
          fi

      - name: Guarda os shapefiles do mapa
        if: always() && hashFiles('dados/geo/*.zip') != ''
        uses: actions/cache/save@v4
        with:
          path: dados/geo
          key: geo-${{ github.run_id }}

      - name: Guarda os arquivos baixados
        if: always() && steps.modo.outputs.baixar == 'sim'
        uses: actions/cache/save@v4
        with:
          path: dados/brutos
          key: brutos-${{ github.run_id }}

      - name: Diagnóstico dos arquivos da ANP
        if: always() && steps.modo.outputs.baixar == 'sim'
        run: python -m robo.diagnostico || true

      - name: Recupera o histórico de notícias
        uses: actions/cache/restore@v4
        with:
          path: dados/noticias
          key: noticias-${{ github.run_id }}
          restore-keys: noticias-

      # notícia nunca trava o site: se as fontes falharem, publica com as manchetes que já tinha
      - name: Notícias do setor
        run: python -m robo.noticias || echo "::warning::Coleta de notícias falhou; o site sai com as manchetes anteriores."

      - name: Guarda o histórico de notícias
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dados/noticias
          key: noticias-${{ github.run_id }}

      - name: Mantém o agendamento ativo
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/atualizar.yml/enable" || true

      - name: Relatório da conferência
        if: always()
        run: cat dados/processados/conferencia.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Gera o site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_CONTATO: ${{ vars.SITE_CONTATO }}
          SITE_PREVIA: ${{ vars.SITE_PREVIA || '0' }}   # '1' volta a faixa "em validação" e o noindex
        run: python -m gerador.gerar --links-limpos

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publico

  publicar:
    needs: atualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
